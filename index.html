<script>
window.addEventListener('DOMContentLoaded', () => {
  const {days, stays, budget, extras} = JSON.parse(document.getElementById('atlas-data').textContent);
  const style = JSON.parse(document.getElementById('basemap-style').textContent);
  // Tile providers sometimes put native characters in the nominally Latin field.
  // Preserve English and romanized place names, and omit labels without a Latin spelling.
  const romanCharacters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 -–—_.,:;/'’()&·+!?#°éèêëàáäåçíïñóöøúüýÿāīūēōĀĪŪĒŌ";
  const maxLabelLength = 56;
  const label = ['var','label'];
  const romanOnly = ['all',['<=',['length',label],maxLabelLength],
    ...Array.from({length:maxLabelLength},(_,i)=>['in',['slice',label,i,i+1],romanCharacters])];
  for (const layer of style.layers) {
    const textField = layer.layout?.['text-field'];
    if (textField) {
      layer.layout['text-field'] = ['let','label',['to-string',textField],['case',romanOnly,label,'']];
    }
  }
  const rate = 158.84;
  const yen = new Intl.NumberFormat('en-US', {style:'currency',currency:'JPY',maximumFractionDigits:0});
  const usd = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD',maximumFractionDigits:0});
  const html = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const amount = (number, suffix, scale = 1) => Number(number.replaceAll(',','')) * (suffix ? 1000 : scale);
  function prices(text) {
    return String(text).replace(/¥\s*¥/g,'¥').replace(/¥\s*([\d,]+(?:\.\d+)?)(k)?(?:\s*[–—-]\s*¥?\s*([\d,]+(?:\.\d+)?)(k)?)?(\+)?/gi,
      (_, low, lowK, high, highK, plus) => {
        const start = amount(low, lowK, highK && Number(low.replaceAll(',','')) < 100 ? 1000 : 1);
        const end = high ? amount(high, highK) : null;
        const suffix = plus ? '+' : '';
        return `${yen.format(start)}${end === null ? '' : '–' + yen.format(end)}${suffix} (≈ ${usd.format(start/rate)}${end === null ? '' : '–' + usd.format(end/rate)}${suffix})`;
      });
  }
  const copy = value => html(prices(value));
  const panel = document.getElementById('panel');
  const sidebar = panel.closest('.sidebar');
  const modeButtons = [...document.querySelectorAll('[data-mode]')];
  let currentMode = 'day', dayIndex = 0, stayIndex = 0, activeStop = null, dayScroll = 0, showOptional = false;
  let map, markers = [], popup, route = {type:'FeatureCollection',features:[]};
  const stage = document.getElementById('map');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const first = days[0].stops;
  const routeBases = [
    {title:'Tokyo', desc:'Nov 20–24 · 4 nights', day:0, pos:first[1].pos},
    {title:'Kyoto', desc:'Nov 24–29 · 5 nights', day:4, pos:stays[1].pos},
    {title:'Kinosaki Hot Springs', desc:'Nov 29–30 · 1 night', day:9, pos:stays[2].pos},
    {title:'Osaka', desc:'Nov 30–Dec 2 · 2 nights', day:10, pos:stays[3].pos},
    {title:'Tokyo and Narita', desc:'Dec 2–3 · 1 night', day:12, pos:first[0].pos},
  ];
  const link = (url,label) => url?.startsWith('https://') ? `<a class="action" href="${html(url)}" target="_blank" rel="noopener noreferrer">${html(label)}</a>` : '';
  const photo = (url, alt) => url?.startsWith('https://') ? `<img src="${html(url)}" alt="${html(alt)}" referrerpolicy="no-referrer" loading="lazy">` : '';
  const optionalIndex = index => extras[index] ?? [];
  const dateButtons = () => days.map((d,i) => `<button type="button" class="day" data-day="${i}" aria-pressed="${i===dayIndex}" aria-label="${html(d.day+' '+d.number+' '+d.month)}"><small>${html(d.day)}</small><b>${d.number}</b><small>${html(d.month)}</small></button>`).join('');
  function placeCard(stop, i, optional = false) {
    const open = stop.id === activeStop;
    return `<article class="place" aria-current="${open}"><button type="button" class="place-head" data-stop="${html(stop.id)}" aria-expanded="${open}"><span class="pin-num">${optional ? '↗' : String(i+1).padStart(2,'0')}</span><span><b>${html(stop.name)}</b><small>${html(stop.kind)}</small></span><span aria-hidden="true">›</span></button>${open ? `<div class="place-body">${photo(stop.photo,stop.name)}${stop.description.map(line=>{const index=line.indexOf(':');return index<0?`<p>${copy(line)}</p>`:`<p><strong>${html(line.slice(0,index+1))}</strong> ${copy(line.slice(index+1).trim())}</p>`;}).join('')}<div class="actions">${link(stop.maps,'Map')}${link(stop.wiki,'Photos')}</div></div>` : ''}</article>`;
  }
  function renderDay() {
    const d = days[dayIndex];
    const opts = optionalIndex(dayIndex);
    panel.innerHTML = `<div class="day-scroll" aria-label="Trip dates">${dateButtons()}</div>
      <div class="hero">${photo(d.photo,d.title+' reference photograph')}<div><span class="eyebrow">${html(d.label)}</span><h2>${html(d.title)}</h2><p>${html(d.base)}</p></div></div>
      <div class="chips"><span class="chip cost">${copy(d.cost)}</span></div>
      <p class="intro">${html(d.intro)}</p>
      ${d.stay>=0 ? `<div class="stay-callout"><button type="button" data-stay-jump="${d.stay}">Compare hotels</button></div>` : ''}
      <div class="section-label">Stops</div>
      <div class="places">${d.stops.map((s,i)=>placeCard(s,i)).join('')}</div>
      ${opts.length ? `<div class="callout"><b>Optional</b> · ${html(opts.map(s=>s.name).join(' · '))}<div class="actions"><button class="action" data-optional type="button" aria-pressed="${showOptional}">${showOptional?'Hide':'Show'} optional pins</button></div></div>` : ''}
      ${showOptional && opts.length ? `<div class="places">${opts.map((s,i)=>placeCard(s,i,true)).join('')}</div>` : ''}
      <div class="actions">${link(d.transit,d.transitLabel)}<button class="action" data-fit type="button">Fit day’s stops</button></div>
      `;
    const scroll = panel.querySelector('.day-scroll');
    scroll.scrollLeft = dayScroll;
  }
  function renderOverview() {
    panel.innerHTML = `<h2 class="panel-title">Trip route</h2>
      
      ${routeBases.map((b,i)=>`<button type="button" class="route-step" data-day="${b.day}"><span class="pin-num">${String(i+1).padStart(2,'0')}</span><span><b>${html(b.title)}</b><small>${html(b.desc)}</small></span><span aria-hidden="true">↗</span></button>`).join('')}
      
      <button type="button" class="action" data-fit>Show entire route</button>`;
  }
  function renderStays() {
    const stay=stays[stayIndex];
    panel.innerHTML=`<h2 class="panel-title">Hotels</h2>
      <p class="intro">Rooms for two. Select a city to compare.</p>
      <div class="stay-scroll">${stays.map((s,i)=>`<button type="button" class="stay-tab" data-stay="${i}" aria-pressed="${i===stayIndex}">${html(s.label)}<small>${html(s.dates)}</small></button>`).join('')}</div>
      <span class="eyebrow">${html(stay.meta)}</span><h3>${html(stay.title)}</h3>
      ${stay.details.map(line=>`<p class="note">${copy(line)}</p>`).join('')}
      ${stay.cards.map((h,i)=>`<article class="hotel" id="hotel-${i}"><h4>${html(h.heading)}</h4>
        ${h.details.map(line=>`<p>${copy(line)}</p>`).join('')}<div class="rates">${h.rates.map(line=>`<p>${copy(line)}</p>`).join('')}</div>
        <div class="actions">${h.links.map(a=>link(a.url,a.text)).join('')}</div></article>`).join('')}
      <p class="note">Hotel pins show approximate areas. Rates are per room for two.</p>
      <p class="fx">${rateNote()}</p>`;
    const active = panel.querySelector('[data-stay][aria-pressed=true]');
    if (active) {
      const strip = active.parentElement;
      strip.scrollLeft = Math.max(0, active.offsetLeft - strip.offsetLeft - 7);
    }
  }
  function rateNote() {
    return `USD estimates use ¥${rate} per US$1 on Nov 11, 2026. <a href="https://www.boj.or.jp/en/statistics/market/forex/fxdaily/fxlist/fx261111.pdf" target="_blank" rel="noopener noreferrer">Bank of Japan</a>.`;
  }
  function renderBudget() {
    panel.innerHTML=`<h2 class="panel-title">Budget and travel</h2>
      <p class="fx">${rateNote()}</p>
      ${budget.map(item=>`<article class="budget-item"><h3>${html(item.title)}</h3><p>${copy(item.text)}</p></article>`).join('')}
      `;
  }
  function render() {
    const focused = document.activeElement;
    const focusKey = focused?.closest('#panel button')?.dataset;
    modeButtons.forEach(b=>{const selected=b.dataset.mode===currentMode;b.setAttribute('aria-selected',selected);b.tabIndex=selected?0:-1;});
    panel.setAttribute('aria-labelledby','mode-'+currentMode);
    ({day:renderDay,overview:renderOverview,stays:renderStays,budget:renderBudget})[currentMode]();
    if (focusKey) {
      const entry = Object.entries(focusKey)[0];
      const target = [...panel.querySelectorAll('button')].find(b=>entry && b.dataset[entry[0]]===entry[1]);
      target?.focus({preventScroll:true});
    }
    panel.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;},{once:true}));
  }
  function switchMode(mode) {
    currentMode=mode;
    activeStop=null;
    sidebar.scrollTop=0;
    render();
    updateMap(true);
  }
  function chooseDay(index) {
    const strip=panel.querySelector('.day-scroll');
    if(strip) dayScroll=strip.scrollLeft;
    dayIndex=index;
    showOptional=false;
    switchMode('day');
    panel.querySelector('[data-day][aria-pressed=true]')?.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  function selectStop(id, fromMap=false) {
    activeStop=activeStop===id && !fromMap ? null : id;
    dayScroll=panel.querySelector('.day-scroll').scrollLeft;
    render();
    const stop = [...days[dayIndex].stops,...optionalIndex(dayIndex)].find(x=>x.id===activeStop);
    updateMap(false);
    if(stop && map) {
      map.easeTo({center:stop.pos,zoom:Math.max(11,map.getZoom()),duration:reducedMotion?0:320});
      showPopup(stop);
    }
    if(fromMap) {
      const card=[...panel.querySelectorAll('[data-stop]')].find(b=>b.dataset.stop===id);
      if (sidebar.scrollHeight>sidebar.clientHeight) card?.scrollIntoView({block:'nearest'});
    }
  }
  modeButtons.forEach((b,index)=>{
    b.addEventListener('click',()=>switchMode(b.dataset.mode));
    b.addEventListener('keydown',event=>{
      const next={ArrowRight:(index+1)%4,ArrowLeft:(index+3)%4,Home:0,End:3}[event.key];
      if(next===undefined)return;
      event.preventDefault();
      modeButtons[next].click();
      modeButtons[next].focus();
    });
  });
  panel.addEventListener('click',event=>{
    const b=event.target.closest('button');
    if(!b)return;
    if(b.dataset.day!==undefined){chooseDay(Number(b.dataset.day));return;}
    if(b.dataset.stay!==undefined || b.dataset.stayJump!==undefined){
      stayIndex=Number(b.dataset.stay ?? b.dataset.stayJump);
      switchMode('stays');
      return;
    }
    if(b.dataset.stop!==undefined){selectStop(b.dataset.stop);return;}
    if(b.hasAttribute('data-optional')){
      dayScroll=panel.querySelector('.day-scroll').scrollLeft;
      showOptional=!showOptional;
      if(!showOptional && optionalIndex(dayIndex).some(s=>s.id===activeStop))activeStop=null;
      render();
      updateMap(true);
      return;
    }
    if(b.hasAttribute('data-fit')) updateMap(true);
  });
  function mapText(kicker,title,description) {
    document.getElementById('map-kicker').textContent=kicker;
    document.getElementById('map-title').textContent=title;
    document.getElementById('map-description').textContent=description;
  }
  function mapBounds(positions, national=false) {
    if(!map || positions.length===0)return;
    const bounds=positions.reduce((box,coord)=>box.extend(coord),new maplibregl.LngLatBounds());
    const compact=stage.clientWidth<580;
    map.fitBounds(bounds,{padding:{top:compact?62:90,bottom:compact?49:79,left:compact?30:72,right:compact?31:72},maxZoom:national?5.8:14.2,duration:reducedMotion?0:390});
  }
  function setLine(positions) {
    route={type:'FeatureCollection',features:positions.length>1?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:positions}}]:[]};
    map?.getSource('stop-order')?.setData(route);
  }
  function showPopup(stop) {
    popup?.remove();
    if (!map) return;
    const box=document.createElement('div');
    box.innerHTML=`<strong>${html(stop.name)}</strong>${link(stop.maps,'Open in Google Maps ↗')}`;
    popup=new maplibregl.Popup({offset:19}).setLngLat(stop.pos).setDOMContent(box).addTo(map);
  }
  function addPin(stop,label,kind,click) {
    if (!map || !stop.pos) return;
    const element=document.createElement('button');
    element.type='button';
    element.className='marker '+kind+(stop.id && stop.id===activeStop?' selected':'');
    element.textContent=label;
    element.setAttribute('aria-label',stop.name);
    element.title=stop.name;
    element.addEventListener('click',event=>{event.stopPropagation();click();});
    markers.push(new maplibregl.Marker({element,anchor:'center'}).setLngLat(stop.pos).addTo(map));
  }
  function updateMap(fit) {
    popup?.remove();
    markers.forEach(marker=>marker.remove());
    markers=[];
    if(currentMode==='day'){
      const d=days[dayIndex], opts=showOptional?optionalIndex(dayIndex):[];
      const active=[...d.stops,...opts].find(s=>s.id===activeStop);
      mapText(d.label,active?.name ?? d.title,active?.description[0]?.replace(/^Why we're here: /,'') ?? 'Select a pin or stop');
      d.stops.forEach((s,i)=>addPin(s,i+1,s.optional?'optional':'',()=>selectStop(s.id,true)));
      opts.forEach(s=>addPin(s,'+', 'optional',()=>selectStop(s.id,true)));
      setLine(d.stops.filter(s=>!s.optional).map(s=>s.pos));
      if(fit)mapBounds([...d.stops,...opts].map(s=>s.pos));
      return;
    }
    if(currentMode==='stays'){
      const stay=stays[stayIndex];
      mapText('Hotel neighborhoods',stay.title,'Hotel areas and nearby stops.');
      stay.cards.forEach((h,i)=>addPin({name:h.heading,pos:h.pos,maps:h.links.find(l=>l.text.includes('Maps'))?.url},'⌂','base',()=>{
        showPopup({name:h.heading,pos:h.pos,maps:h.links.find(l=>l.text.includes('Maps'))?.url});
        const card=document.getElementById('hotel-'+i);
        if (sidebar.scrollHeight>sidebar.clientHeight) card?.scrollIntoView({block:'nearest'});
      }));
      const nearby=stay.nearby.map(id=>days.flatMap(d=>d.stops).find(s=>s.id===id)).filter(Boolean);
      nearby.forEach((s,i)=>addPin(s,i+1,'',()=>showPopup(s)));
      setLine([]);
      if(fit)mapBounds([...stay.cards.map(h=>h.pos),...nearby.map(s=>s.pos)]);
      return;
    }
    mapText('Japan','Trip route','Orange pins show stays and the departure airport.');
    routeBases.forEach((base,i)=>addPin({name:base.title,pos:base.pos},i+1,'base',()=>chooseDay(base.day)));
    setLine([routeBases[0].pos,...routeBases.slice(1,4).map(x=>x.pos),routeBases[0].pos,routeBases[4].pos]);
    if(fit)mapBounds(routeBases.map(b=>b.pos),true);
  }
  document.getElementById('whole-map').addEventListener('click',()=>switchMode('overview'));
  render();
  try {
    map=new maplibregl.Map({container:stage,style,center:[137,36],zoom:5,renderWorldCopies:false,attributionControl:{compact:true},maxZoom:17});
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
    map.on('error',()=>{if(!map.loaded()) document.getElementById('map-error').hidden=false;});
    map.on('load',()=>{
      document.getElementById('map-error').hidden=true;
      map.addSource('stop-order',{type:'geojson',data:route});
      map.addLayer({id:'stop-order',type:'line',source:'stop-order',paint:{'line-color':'#3b6865','line-width':2.5,'line-dasharray':[2,2],'line-opacity':.76}});
    });
    new ResizeObserver(()=>map.resize()).observe(stage);
  } catch(error) {
    document.getElementById('map-error').hidden=false;
  }
  updateMap(true);
});
</script>
</body>
</html>
